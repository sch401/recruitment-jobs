<script>
'use strict';
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('zh-CN');
let catalog=null,pendingData=null,syncState={},educationByCompany=new Map(),tab='jobs',page=1,filtered=[],lastFocus=null;
const size=30,names={jobs:'招聘记录',companies:'招聘单位',pending:'待补查',schools:'来源高校'};
const missing=v=>!v||/^(原文未注明|待核实|none|null)$/i.test(String(v));
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value??'');if(cls)e.className=cls;return e;};
function safeUrl(value){try{const u=new URL(publicJobUrl(value),location.href);return ['http:','https:','mailto:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function link(value,label,cls){const href=safeUrl(value);if(!href)return text('span',label||'链接待核实','cell-muted');const a=text('a',label||new URL(href).hostname,cls);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a;}
function urls(value){return [...new Set((String(value||'').match(/https?:\/\/[^\s<>"，；]+/g)||[]).map(v=>v.replace(/[。;]$/,'')))];}
function timestamp(value){if(!value)return '尚无记录';return new Date(value).toLocaleString('zh-CN',{timeZone:'Europe/London',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})+'（英国时间）';}
async function getJson(file){const response=await fetch(file,{cache:'no-cache'});if(!response.ok)throw Error('读取数据失败（'+response.status+'）');return response.json();}
function dateRange(){const p=$('period').value;if(p==='all')return ['', ''];if(p==='custom')return [$('date-from').value,$('date-to').value];const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));now.setDate(now.getDate()-Number(p)+1);return [now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),''];}
function companyDegreeMatches(name,raw,selected){const values=educationByCompany.get(name);return values?.length?values.some(v=>educationMatches(v,selected)):educationMatches(raw,selected);}
function rowDate(r){return String(tab==='jobs'?r[9]:tab==='pending'?r[7]:tab==='companies'?r[6]:'').slice(0,10);}
function source(r){return String(tab==='jobs'?r[13]:tab==='pending'?r[0]:tab==='companies'?r[5]:r[0]||'');}
function applyFilters(){if(!catalog)return;const query=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),school=$('school').value,degree=$('degree').value,city=$('city').value.trim();const [from,to]=dateRange();let rows=tab==='jobs'?catalog.jobs:tab==='companies'?catalog.companies:tab==='schools'?catalog.coverage:pendingData?.rows||[];
filtered=rows.filter(r=>{if(!query.every(q=>r.some(v=>String(v||'').toLowerCase().includes(q))))return false;if(school&&!source(r).includes(school))return false;if(tab==='jobs'||tab==='companies'){const d=String(r[tab==='jobs'?4:2]||'');if(degree&&!(tab==='jobs'?educationMatches(d,degree):companyDegreeMatches(r[0],d,degree)))return false;if(city&&!String(r[tab==='jobs'?6:4]||'').includes(city))return false;}
if(tab!=='schools'){const date=rowDate(r);if(from&&(!date||date<from))return false;if(to&&(!date||date>to))return false;}return true;});if(tab!=='schools')filtered.sort((a,b)=>$('sort').value==='asc'?rowDate(a).localeCompare(rowDate(b)):rowDate(b).localeCompare(rowDate(a)));page=1;render();}
function addCell(tr,child,cls){const cell=document.createElement('td');if(cls)cell.className=cls;if(child instanceof Node)cell.append(child);else cell.textContent=child??'';tr.append(cell);return cell;}
function titleButton(title,onClick){const b=text('button',title,'job-title');b.onclick=onClick;return b;}
function table(headers,widths){const t=document.createElement('table'),head=document.createElement('thead'),row=document.createElement('tr');headers.forEach((h,i)=>{const th=text('th',h);th.style.width=widths[i];row.append(th);});head.append(row);t.append(head);const body=document.createElement('tbody');t.append(body);return [t,body];}
function render(){const wrap=$('results');wrap.replaceChildren();$('result-count').textContent=fmt(filtered.length);$('result-label').textContent=tab==='companies'?'家匹配单位':tab==='schools'?'所来源高校':'条匹配记录';const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('page-number').textContent=page+' / '+pages;$('page-info').textContent=filtered.length?'显示 '+((page-1)*size+1)+'–'+Math.min(page*size,filtered.length)+' / '+fmt(filtered.length):'暂无匹配记录';if(!filtered.length){wrap.append(text('div','没有匹配记录，试试调整关键词或日期范围。','empty'));return;}
let t,body;if(tab==='jobs'){[t,body]=table(['招聘单位 / 岗位','专业要求','学历','工作地点','记录日期','来源'],['31%','23%','10%','13%','12%','11%']);for(const r of filtered.slice((page-1)*size,page*size)){const tr=document.createElement('tr'),main=document.createElement('div');main.append(text('div',r[0],'company'),titleButton(r[1],()=>showJob(r)));if(!missing(r[7]))main.append(text('div',r[7],'salary'));addCell(tr,main);addCell(tr,text('div',r[3],'snippet'));addCell(tr,text('span',educationLabel(r[4]),'badge'));addCell(tr,text('div',r[6]||'原文未注明','snippet'));const dc=document.createElement('div');dc.append(text('div',String(r[9]||'').slice(0,10),'date-text'),text('div',r[10]||'','cell-muted'));addCell(tr,dc);const sc=document.createElement('div');sc.append(text('div',r[13],'school-text'));const u=urls(r[14])[0];if(u)sc.append(link(u,'查看原文 ↗','source-link'));addCell(tr,sc);body.append(tr);}}
else if(tab==='companies'){[t,body]=table(['招聘单位','专业类别','学历','工作地点','最近日期','来源'],['30%','14%','12%','18%','13%','13%']);for(const r of filtered.slice((page-1)*size,page*size)){const tr=document.createElement('tr');addCell(tr,titleButton(r[0],()=>filterCompany(r[0])));addCell(tr,text('div',r[1],'snippet'));addCell(tr,text('span',educationLabel(r[2]),'badge'));addCell(tr,text('div',r[4],'snippet'));addCell(tr,String(r[6]||'').slice(0,10),'date-text');addCell(tr,text('div',r[5],'snippet'));body.append(tr);}}
else if(tab==='pending'){[t,body]=table(['单位线索 / 公告','待补查原因','来源高校','日期','原公告'],['38%','23%','15%','13%','11%']);for(const r of filtered.slice((page-1)*size,page*size)){const tr=document.createElement('tr'),main=document.createElement('div');main.append(text('div',r[1]||'单位待核实','company'),titleButton(r[2],()=>showPending(r)));addCell(tr,main);addCell(tr,text('div',r[3],'snippet'));addCell(tr,r[0],'school-text');const dc=document.createElement('div');dc.append(text('div',r[7]||'日期待核实','date-text'),text('div',r[8]||'','cell-muted'));addCell(tr,dc);addCell(tr,urls(r[5])[0]?link(urls(r[5])[0],'查看原文 ↗'):text('span','—','cell-muted'));body.append(tr);}}
else{[t,body]=table(['来源高校','招聘单位数','招聘记录数','最近采集结果','官方入口'],['25%','15%','15%','29%','16%']);for(const r of filtered.slice((page-1)*size,page*size)){const tr=document.createElement('tr');addCell(tr,titleButton(r[0],()=>{setTab('jobs');$('school').value=r[0];$('period').value='all';applyFilters();}));addCell(tr,fmt(r[1]));addCell(tr,fmt(r[2]));const status=(syncState.sources||[]).find(s=>s.school===r[0]);addCell(tr,text('span',status?status.status==='ok'?'已检查':status.status==='partial'?'部分可读取':'访问受限':'见原表覆盖说明',status&&status.status!=='ok'?'badge amber':'badge'));addCell(tr,link(r[4],'就业网 ↗'));body.append(tr);}}wrap.append(t);}
async function setTab(next){tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('crumb').textContent=names[tab];$('page-title').textContent={jobs:'化工招聘信息库',companies:'招聘单位',pending:'待补查线索',schools:'来源高校'}[tab];$('page-sub').textContent={jobs:'按岗位专业要求整理，保留原文链接与日期类型。',companies:'点击单位名称，查看该单位的招聘记录。',pending:'专业、实际用人单位或正文仍待核实的线索，独立列示。',schools:'按合并后的招聘记录统计，点击学校可筛选其来源信息。'}[tab];for(const id of ['degree-filter','city-filter'])$(id).classList.toggle('hidden',!['jobs','companies'].includes(tab));$('date-filter').classList.toggle('hidden',tab==='schools');$('sort').classList.toggle('hidden',tab==='schools');$('custom-date').classList.toggle('show',tab!=='schools'&&$('period').value==='custom');$('nav').classList.remove('open');if(tab==='pending'&&!pendingData){$('results').replaceChildren(text('div','正在读取待补查线索…','empty'));try{pendingData=await getJson('data/pending.json');}catch(e){showError(e.message);return;}}applyFilters();}
function filterCompany(name){setTab('jobs');$('search').value=name;$('period').value='all';$('degree').value='';$('city').value='';$('school').value='';applyFilters();}
function openDrawer(){lastFocus=document.activeElement;$('drawer').replaceChildren();const close=text('button','×','close');close.setAttribute('aria-label','关闭详情');close.onclick=closeDrawer;$('drawer').append(close);$('overlay').classList.add('open');document.body.style.overflow='hidden';close.focus();}
function closeDrawer(){$('overlay').classList.remove('open');document.body.style.overflow='';lastFocus?.focus();}
function block(title,value){if(missing(value))return;const box=text('section','','detail-block');box.append(text('h3',title),text('div',value,'detail-text'));$('drawer').append(box);}
function fields(items){const box=text('div','','drawer-meta');for(const [label,value] of items){const e=document.createElement('div');e.append(text('div',label,'detail-label'),text('div',value||'原文未注明','detail-value'));box.append(e);}$('drawer').append(box);}
function linkBlock(title,values,primary=false){if(!values.length)return;const b=text('section','','detail-block');b.append(text('h3',title));const list=text('div','','links');values.forEach((u,i)=>list.append(link(u,primary&&i===0?'打开原公告 ↗':(safeUrl(u)?new URL(safeUrl(u)).hostname:'原文链接'),primary&&i===0?'primary-link':'')));b.append(list);$('drawer').append(b);}
function showJob(r){openDrawer();$('drawer').append(text('div',r[0],'drawer-company'),text('h2',r[1]));fields([['学历',r[4]],['工作地点',r[6]],['薪酬',r[7]],['招聘人数',r[8]],['记录日期',String(r[9]||'')+' · '+String(r[10]||'')],['截止日期',r[11]]]);block('专业要求',r[3]);block('英语条件',r[5]);block('截止时间说明',r[12]);block('来源高校',r[13]);linkBlock('原公告与多校来源',urls(r[14]),true);const apply=urls(r[15]);linkBlock('投递入口',apply);if(!apply.length&&r[15])block('投递方式',r[15]);linkBlock('岗位附件',urls(r[16]));}
function showPending(r){openDrawer();$('drawer').append(text('div',r[0]+' · 待补查','drawer-company'),text('h2',r[2]));fields([['单位线索',r[1]],['记录日期',r[7]?r[7]+' · '+(r[8]||''):'日期待核实']]);block('待补查原因',r[3]);block('原表说明',r[4]);linkBlock('原公告',urls(r[5]),true);linkBlock('相关附件',urls(r[6]));}
async function showSync(){openDrawer();$('drawer').append(text('div','同步状态','drawer-company'),text('h2','本地更新与发布'));try{syncState=await getJson('data/status.json');}catch{}fields([['最近检查',timestamp(syncState.lastAttempt)],['最近成功推送',timestamp(syncState.lastPublishedAt)],['自动更新',syncState.schedule||'每天英国时间09:00'],['最近结果',{ok:'更新成功',partial:'部分来源受限',failed:'更新失败',seed:'已导入当前Excel'}[syncState.outcome]||'尚无自动运行记录']]);block('运行说明','本地电脑联网并登录时执行。错过运行时间后补跑，完成Excel更新后推送至本网站。');if(syncState.runs?.length){const sec=text('section','','detail-block');sec.append(text('h3','最近运行'));for(const run of syncState.runs.slice(0,7)){const e=text('div','','run-row');e.append(text('div',timestamp(run.time)),text('small','采集 '+(run.collected??0)+' 条 · 新增 '+(run.added??0)+' 条 · 合并 '+(run.merged??0)+' 条'+(run.error?' · '+run.error:'')));sec.append(e);}$('drawer').append(sec);}const restricted=(syncState.sources||[]).filter(s=>s.status!=='ok');if(restricted.length)block('本轮受限来源',restricted.map(s=>s.school+'：'+(s.coverage_note||s.error||'部分内容受限')).join('\n'));}
function showError(message){$('error').classList.remove('hidden');$('error').replaceChildren(text('span',message));const b=text('button','重新读取');b.onclick=()=>location.reload();$('error').append(b);}
async function load(){try{catalog=await getJson('data/catalog.json');if(!Array.isArray(catalog.jobs)||!Array.isArray(catalog.coverage))throw Error('招聘数据格式有误');for(const j of catalog.jobs){if(!educationByCompany.has(j[0]))educationByCompany.set(j[0],[]);educationByCompany.get(j[0]).push(j[4]);}for(const key of ['jobs','companies','schools'])$('stat-'+key).textContent=fmt(catalog.stats[key]);$('stat-through').textContent=String(catalog.sourceThrough||'').slice(5).replace('-',' / ')||'—';$('nav-through').textContent='最新记录 '+catalog.sourceThrough;$('edition').textContent='记录截至 '+catalog.sourceThrough;for(const k of ['jobs','companies','pending'])$('nav-'+k).textContent=fmt(catalog.stats[k]);const old=$('school').value;for(const s of catalog.schools)$('school').append(new Option(s,s));$('school').value=old;try{syncState=await getJson('data/status.json');$('sync-time').textContent='同步于 '+timestamp(syncState.lastPublishedAt);$('last-push').textContent='推送于 '+timestamp(syncState.lastPublishedAt);if(syncState.schedule)$('schedule-text').textContent=syncState.schedule;}catch{$('sync-time').textContent='同步状态待读取';}applyFilters();}catch(e){showError(e.message);$('results').replaceChildren(text('div','数据暂时无法读取，请稍后重试。','empty'));}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));let timer;for(const id of ['search','city'])$(id).oninput=()=>{clearTimeout(timer);timer=setTimeout(applyFilters,180);};for(const id of ['degree','school','sort','date-from','date-to'])$(id).onchange=applyFilters;$('period').onchange=()=>{$('custom-date').classList.toggle('show',$('period').value==='custom');applyFilters();};$('reset').onclick=()=>{for(const id of ['search','degree','city','school','date-from','date-to'])$(id).value='';$('period').value='all';$('custom-date').classList.remove('show');applyFilters();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('sync-button').onclick=showSync;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDrawer();};$('menu-toggle').onclick=()=>$('nav').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('nav').classList.remove('open');}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus();}if(e.key==='Tab'&&$('overlay').classList.contains('open')){const controls=$('drawer').querySelectorAll('a[href],button,input,select,[tabindex="0"]');const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(async()=>{if(document.hidden||!catalog)return;try{const status=await getJson('data/status.json');if(status.lastPublishedAt!==syncState.lastPublishedAt){location.reload();}}catch{}},300000);load();
</script></body></html>
